schema_version = "1.0.0"

id = "seamline"
name = "Seamline"
version = "0.1.0"
tagline = "Non-destructive, re-editable panel-line grooves for hard-surface meshes"
maintainer = "Seamline maintainers <https://github.com/DJsluxx/seamline-blender/issues>"
type = "add-on"

# No third-party Python deps; pure bpy.
wheels = []

# Runs fully offline, touches only the current scene's mesh/object data.
permissions = {}

# Tested against Blender 4.2.16 LTS and 5.2.0 LTS on this machine — both
# the headless harness (tests/test_harness.py) and the windowed undo test
# (tests/test_undo.py) pass on both, run via scripts/run_all_tests.ps1. See
# README "Compatibility". Do not lower this without re-running that script
# against the older target first and pasting the passing output.
blender_version_min = "4.2.0"

license = [
  "SPDX:GPL-3.0-or-later",
]
